<svg xmlns="http://www.w3.org/2000/svg" width="24" height="13" viewBox="0 0 24 13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Closed left eye: a nearly straight, relaxed lid line.
       The outer end (left) sits higher; the inner end (right) is about 1.8 px
       lower, giving a flat, unimpressed slant. The sag in the middle is only
       about 0.45 px, so it reads as a lid rather than a smile. -->
  <path d="M 3 5.2 Q 12 6.9 21 7.0"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"/>
</svg>
